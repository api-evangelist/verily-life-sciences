aid: verily-life-sciences
name: Verily Life Sciences
description: 'Verily Life Sciences is Alphabet''s precision health company, building the Verily Pre platform
  — an AI-native data platform for health research and care that ingests multimodal clinical, genomic
  and device data and organizes it with Syntax, a FHIR-native common data model. Its developer-facing
  surface is Verily Workbench, an enterprise Trusted Research Environment that runs analysis workspaces
  on Google Cloud and AWS. Workbench exposes a control-plane REST API at workbench.verily.com/api (the
  wsm workspace-manager, axon and user services), a first-party `wb` command line interface, and a published
  Terraform provider (verily-src/workbench) for managing workspaces, folders, data collections, groups
  and IAM as code. Verily also publishes open-source FHIR tooling on GitHub, including fhirpath-go and
  the fsh-lint FHIR Shorthand linter. No public OpenAPI description is served: the API''s spec endpoints
  return HTTP 403 at the edge.'
