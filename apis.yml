apis:
- aid: verily-life-sciences:verily-life-sciences-workbench-api
  name: Verily Workbench API
  description: 'The Verily Workbench control-plane REST API. Three services are reachable under the workbench.verily.com/api
    base path: `wsm` (Workspace Manager — workspaces, folders, controlled and referenced cloud resources,
    IAM roles and policies), `axon` (CLI distribution, supported CLI version window, workspace orchestration)
    and `user` (user, group and organization management). The API is described by OpenAPI internally —
    Verily''s own open-source Terraform provider ships oapi-codegen generated clients for the wsm and
    user services — but the spec endpoints (/v3/api-docs, /openapi.json, /openapi.yml, swagger-ui) all
    return HTTP 403 to anonymous callers. The unauthenticated /status and /version endpoints on each service
    are public.'
  humanURL: https://support.workbench.verily.com/docs/
  baseURL: https://workbench.verily.com/api
