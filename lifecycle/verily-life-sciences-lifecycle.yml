name: Verily Workbench — lifecycle, versioning and support posture
summary: >-
  Verily runs Workbench as a continuously released product with dated release notes. It publishes no API
  versioning policy, no deprecation or sunset policy for the REST surface, no SLA, and no hosted status
  page. What it does publish — and this is unusually good for a provider with no public spec — is a live,
  machine-readable supported-version window for its CLI client, plus per-service build versions and
  unauthenticated health endpoints.
api_versioning:
  policy_published: false
  scheme: none observed
  note: No version segment appears in the /api/<service> base paths, and no versioning policy page exists.
deprecation_policy:
  published: false
  sunset_header: unknown
  deprecation_header: unknown
  rfc8594: unknown
  note: >-
    No deprecation or sunset policy is published for the API. No `Deprecation` pointer is emitted in
    apis.yml, because a client version-support floor is not an API deprecation policy.
client_support_window:
  published: true
  machine_readable: true
  endpoint: https://workbench.verily.com/api/axon/cli-version
  http_status: 200
  probed: '2026-09-02'
  oldest_supported_cli: 0.421.0
  latest_supported_cli: 0.422.514
  artifact_checksum_published: true
  additional:
    wsm_oldest_supported_cli_version: 0.149.0
    wsm_endpoint: https://workbench.verily.com/api/wsm/version
  note: >-
    Verily publishes the floor and ceiling of supported CLI versions as JSON that a client can read at
    runtime, together with a SHA-256 checksum of the distributed artifact. This is a real, dated,
    provider-published support signal; it just applies to the CLI, not to the REST surface.
