name: Verily Life Sciences — first-party packages and client libraries
summary: >-
  Verily does not publish an npm or PyPI SDK for the Workbench API. Its first-party, machine-installable
  distribution is a Terraform provider (a real API client for the Workbench control plane, generated from
  the internal OpenAPI with oapi-codegen), a Terraform module for the AWS analysis plane, the `wb` CLI
  distributed as a signed tarball from a Google Cloud Storage bucket, and two open-source Go libraries for
  FHIR tooling. Registry searches for `verily` on npm and PyPI returned only unrelated third-party packages
  (npm `verily` is a 2014 semver toy; PyPI `workbench-cli` belongs to SuperCowPowers) — neither is Verily's.
registries_checked:
- registry: npm
  query: verily
  result: no first-party package found
- registry: pypi
  queries: [verily, verily-workbench, workbench-cli]
  result: no first-party package found (name collisions belong to other publishers)
- registry: pkg.go.dev / proxy.golang.org
  result: three first-party Go modules found
- registry: registry.terraform.io
  result: one provider + one module found
- registry: maven-central / nuget / rubygems / crates.io / packagist
  result: not searched — Verily publishes no Java, .NET, Ruby, Rust or PHP client for this API
